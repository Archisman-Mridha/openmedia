plugins {
  id "dev.nx.gradle.project-graph" version "0.1.26"

  /*
    Shadow is a Gradle plugin for combining a project’s dependency classes and resources into a
    single output Jar. The combined Jar is often referred to a fat-jar or uber-jar. Shadow
    utilizes JarInputStream and JarOutputStream to efficiently process dependent libraries into
    the output jar without incurring the I/O overhead of expanding the jars to disk.

    Executable distribution is the main use case for deploying an application that can be
    executed/run in the runtime environment. In the case of Shadow, this is a single uber or fat
    JAR. The JAR file contains all the application code and dependent libraries to execute (not
    including the standard JVM libraries). The shadow JAR does not include the JRE itself. It must
    be available on the target system.

    Executable JARs contain a JAR MANIFEST that specifies the application Main Class. This allows
    the application to be started with a single command:

                                  java -jar application-shadow.jar
  */
  id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

// Gradle provides extra properties for storing user-defined data on enhanced objects such as
// project.
ext {
  javaVersion = '21'

  flinkVersion = '2.2.1'

  // The Simple Logging Facade for Java (SLF4J) serves as a simple facade or abstraction for
  // various logging frameworks (e.g. java.util.logging, logback, log4j) allowing the end user to
  // plug in the desired logging framework at deployment time.
  slf4jVersion = '1.7.36'

  // Apache Log4j is a versatile, industrial-grade Java logging framework composed of an API, its
  // implementation, and components to assist the deployment for various use cases. 
  log4jVersion = '2.24.3'
}

wrapper {
  gradleVersion = '8.14.4'
}

allprojects {
  apply {
    plugin("dev.nx.gradle.project-graph")
  }
}

subprojects {
  // Artifact properties
  group = 'openmedia.data-processing-pipelines'
  version = '0.1-SNAPSHOT'

  // Declare where to find the dependencies of your project
  repositories {
    mavenCentral()
    maven { url = "https://repository.apache.org/content/repositories/snapshots/" }
  }

  plugins.withType(JavaPlugin) {
    java {
      sourceCompatibility = javaVersion
      targetCompatibility = javaVersion
    }

    tasks.withType(JavaCompile) {
      options.encoding = 'UTF-8'
    }
  }
}
