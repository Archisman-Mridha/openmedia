name: openmedia

networks:
  openmedia: {}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    hostname: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"

  atlasgo:
    image: arigaio/atlas:1.2.3-alpine
    entrypoint:
      - "/bin/sh"
      - "-c"
    command:
      - >
        /atlas migrate hash --dir file:///migrations && /atlas migrate apply --dir file:///migrations --url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/schema.sql:/migrations/000000_init.sql

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: --cluster_mode=emulated --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "redis-cli -a ${REDIS_PASSWORD} ping"

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    ports:
      - "7700:7700"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:7700/health"

  # This Docker image runs a GraalVM based native Kafka broker. GraalVM provides ahead-of-time
  # Native Image compilation of the broker running in KRaft combined mode by default (i.e., it
  # serves as both broker and KRaft controller) into a native binary executable
  #
  # It's important to note that if you are overriding any configuration, then none of the default
  # configurations will be used. 
  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME}\" password=\"${KAFKA_PASSWORD}\" user_${KAFKA_USERNAME}=\"${KAFKA_PASSWORD}\";"
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required user_${KAFKA_USERNAME}=\"${KAFKA_PASSWORD}\";"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "19092:19092"

  debezium:
    image: quay.io/debezium/connect:3.7.1.Final
    environment:
    depends_on:
      kafka:
        condition: service_healthy
      atlasgo:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
