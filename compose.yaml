name: openmedia

networks:
  openmedia: {}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    hostname: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"

  atlasgo:
    image: arigaio/atlas:1.2.3-alpine
    entrypoint:
      - "/bin/sh"
      - "-c"
    command:
      - >
        /atlas migrate hash --dir file:///migrations && /atlas migrate apply --dir file:///migrations --url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/schema.sql:/migrations/000000_init.sql

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: --cluster_mode=emulated --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "redis-cli -a ${REDIS_PASSWORD} ping"

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    ports:
      - "7700:7700"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:7700/health"

  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME}\" password=\"${KAFKA_PASSWORD}\" user_${KAFKA_USERNAME}=\"${KAFKA_PASSWORD}\";"
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required user_${KAFKA_USERNAME}=\"${KAFKA_PASSWORD}\";"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "19092:19092"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "nc -z localhost 9092"

  kafka-topics:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_CLIENT_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME}\" password=\"${KAFKA_PASSWORD}\";"
    entrypoint:
      - "/bin/bash"
      - "-c"
    command:
      - |
        printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=%s\n' "$$KAFKA_CLIENT_JAAS_CONFIG" > /tmp/client.properties
        for topic in events.users.created events.profiles.created events.followships.created events.followships.deleted events.posts.created; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/client.properties \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 || exit 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  debezium:
    image: quay.io/debezium/connect:3.7.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: &kafka-client-jaas-config "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME}\" password=\"${KAFKA_PASSWORD}\";"
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: *kafka-client-jaas-config
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: *kafka-client-jaas-config
      # Lets the connector configs reference the Postgres credentials as ${env:...}.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      kafka:
        condition: service_healthy
      atlasgo:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fs http://localhost:8083/connectors"

  # Registers (or updates) the Debezium CDC pipelines in debezium/connectors.
  debezium-connectors:
    image: curlimages/curl:8.17.0
    entrypoint:
      - "/bin/sh"
      - "-c"
    command:
      - |
        for connector in /connectors/*.json; do
          name=$$(basename "$$connector" .json)
          curl -fsS -X PUT -H "Content-Type: application/json" --data @"$$connector" \
            "http://debezium:8083/connectors/$$name/config" || exit 1
          echo
        done
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/connectors:/connectors:ro

  feed-processor-jobmanager:
    build: ./feed-processor
    command: standalone-job --job-classname openmedia.feeds.FeedProcessorJob
    environment: &feed-processor-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: feed-processor-jobmanager
        parallelism.default: 1
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      atlasgo:
        condition: service_completed_successfully
    ports:
      - "8081:8081"

  feed-processor-taskmanager:
    build: ./feed-processor
    command: taskmanager
    environment: *feed-processor-environment
    depends_on:
      - feed-processor-jobmanager
